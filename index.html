/* ---- v3 : Recouvrement ---- */
.sv tr.e{--lc:#ff7a9c}

.sv tr.a>:last-child{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.sv tr.v>:last-child{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.sv tr.s>:last-child{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.e>:last-child{background:linear-gradient(135deg,#4a1226,#80233f);color:#ffb8cb}
.ring{display:block;overflow:visible;max-width:100%;height:auto;shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
.ring text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-kerning:normal}
.ring .pg{animation:ringin 1.7s cubic-bezier(.22,.8,.2,1) both}

.ring .hz{animation:ringin 1.7s cubic-bezier(.22,.8,.2,1) both,twk 3.2s ease-in-out 1.7s infinite}
@keyframes twk{0%,100%{opacity:.30}18%{opacity:.62}34%{opacity:.38}55%{opacity:.70}78%{opacity:.34}}
.ring .dg{transform-box:view-box;transform-origin:90px 90px;animation:dotin 1.7s cubic-bezier(.22,.8,.2,1) both}
@keyframes dotin{from{transform:rotate(0deg)}to{transform:rotate(var(--ang))}}

@keyframes dotpulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.55);opacity:0}}
.ring .tk{opacity:.55;animation:tkspin 24s linear infinite;transform-box:view-box;transform-origin:90px 90px}

/* ---- v3 : noms de molécules pendant l'envoi ---- */
#mols{position:fixed;inset:0;pointer-events:none;z-index:52;overflow:hidden}

@keyframes molf{0%{opacity:0;transform:translateY(8px) scale(.92)}25%{opacity:.95}70%{opacity:.85}100%{opacity:0;transform:translateY(-12px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.ring,.ring .pg,.ring .hz,.ring .dg,.ring .hl,.ring .tk{animation:none}}
/* ---- v4 ---- */
.bt th:first-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;border-right:2px solid #f2c14e}
.bt td.lb{border-right:2px solid var(--lc,#f2c14e)}

.bt tr.r3 td.lb{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.h>:first-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.sv tr:not(.h)>:first-child{font-weight:800;border-right:2px solid var(--lc,#f2c14e)}
.sv tr.a>:first-child{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.sv tr.v>:first-child{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.sv tr.s>:first-child{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.e>:first-child{background:linear-gradient(135deg,#4a1226,#80233f);color:#ffb8cb}
.sv tr.e>td:not(:first-child):not(:last-child){background:#33161f}

/* ===== BILAN : tableau des versements, lisibilité alignée sur le tableau de Recouvrement (.sv) ===== */
.bt{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bt th,.bt td{white-space:normal;min-width:104px;font-size:13px;font-weight:700;text-align:center;padding:11px 8px;letter-spacing:.1px}
.bt th{background:#0f4d3c;color:#e8fbff;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #3AFEEB}

</style></head><body>
<div id="login"><img src="icon-512.png" alt=""><h1>Gestion Pharmacie - EPHD Sandégué 2027</h1><p>Connectez-vous avec votre compte Microsoft pour accéder au classeur.</p><button class="p" onclick="signIn()">Se connecter</button><p id="err" style="color:var(--ko)"></p></div>
<div id="app" class="hide">
<header><div class="top"><img class="lg" src="icon-192.png" alt=""><h1>Gestion Pharmacie - EPHD Sandégué 2027</h1><button id="rf" class="rf" onclick="load()" aria-label="Actualiser"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
<div class="row"><select id="mois" onchange="load()"></select><select id="mode" onchange="render()"><option value="pos">Ordre magasin</option><option value="todo">À inventorier</option><option value="vente">Plus vendus</option></select></div>
<div id="sf"><div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Rechercher un produit…" oninput="render()"></div></div>
<div class="srow"><div id="st"></div><button class="out" onclick="signOut()">Se déconnecter</button></div><div id="bar"><i></i></div><div id="fin" class="hide">✔ INVENTAIRE TERMINÉ</div></header>
<main id="main"></main>
<div id="act"><button id="b-stock" class="p" onclick="valider()">Je valide l'inventaire.</button><button id="b-bilan" class="p hide" onclick="validerB()">Je valide les recettes.</button></div>
<nav><button id="t-stock" class="on" onclick="tab('stock')">📦 Stock</button><button id="t-bilan" onclick="tab('bilan')">💰 Bilan</button><button id="t-rec" onclick="tab('rec')">📈 Recouvrement</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
/* ====== CONFIGURATION ====== */
const CLIENT_ID = "2fd34dea-3839-4d3c-ad3b-6e08817b507a";
const FILE_PATH = "/Gestion Pharma FP/O_PHARMA_2027.xlsm";
/* =========================== */
const MOIS=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
const EDIT=["STOCK ENTRÉ","STOCK INVENTORIÉ","PERTES"],ELAB=["Entré","Inventorié","Pertes"];
const pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];
const $=id=>document.getElementById(id),enc=encodeURIComponent,S="§",J=JSON.stringify;
const num=v=>typeof v==="number"?Math.round(v).toLocaleString("fr-FR"):(v||"0");const fcfa=v=>num(v)+"\u00a0F\u00a0CFA";
let CACHE=(()=>{try{return JSON.parse(localStorage.getItem("op_notes")||"{}")}catch(e){return{}}})(),NX={},NXT=false,token,H=[],R=[],origin={row:5,col:0},editing=false,cur="stock",NOTES={},NROWS=[],NT=false,BIL=null;
let P=Object.assign({v:{},c:{},b:{}},JSON.parse(localStorage.getItem("op_pend")||"{}"));
const keep=()=>localStorage.setItem("op_pend",J(P));
let SENDING=false;
function btns(){const m=$("mois").value,has=o=>Object.keys(o).some(k=>k.startsWith(m+S));$("b-stock").disabled=SENDING||!(has(P.v)||has(P.c));$("b-bilan").disabled=SENDING||!has(P.b)}
MOIS.forEach(m=>$("mois").add(new Option(m,m)));$("mois").value=MOIS[new Date().getMonth()];
async function signIn(){try{await pca.loginRedirect({scopes:SCOPES})}catch(e){$("err").textContent=e.message}}
async function tok(){const a=pca.getAllAccounts()[0];if(!a)throw 0;try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES})}}
async function g(path,opt={}){const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${encodeURI(FILE_PATH)}:/workbook${path}`,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error?.message||r.status);return r.json()}
const col=n=>{let s="";n++;while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
const parse=a=>{const m=a.split("!")[1].replace(/\$/g,"").match(/([A-Z]+)(\d+):/);return{row:+m[2],col:[...m[1]].reduce((x,c)=>x*26+c.charCodeAt(0)-64,0)-1}};
const put=(addr,sheet,v)=>g(`/worksheets('${enc(sheet)}')/range(address='${addr}')`,{method:"PATCH",body:J({values:[[v]]})});
function tab(t){cur=t;for(const k of["stock","bilan","rec"])$("t-"+k).classList.toggle("on",k==t);
 const s=t=="stock";$("act").classList.toggle("hide",t=="rec");$("b-stock").classList.toggle("hide",!s);$("b-bilan").classList.toggle("hide",t!="bilan");
 for(const i of["sf","mode","bar"])$(i).classList.toggle("hide",!s);$("mois").classList.toggle("hide",t=="rec");$("fin").classList.add("hide");load()}
const saveCache=()=>localStorage.setItem("op_notes",J(CACHE));
/* Notes : base = feuille NOTES_EXCEL (exportée par la macro à chaque enregistrement du classeur) ;
   par-dessus : notes envoyées par l'appli et pas encore converties/exportées par Excel (NOTES_APP + cache local). */
async function loadNotes(){NX={};NXT=false;NOTES={};NROWS=[];NT=false;const pend={};
 try{const x=await g("/tables('NOTES_EXCEL')/range");x.values.slice(1).forEach(r=>{if(r[0]&&r[1]&&r[2]&&String(r[3]).trim()!=="")NX[r[0]+S+r[1]+S+r[2]]=String(r[3])});NXT=true}catch(e){}
 try{const d=await g("/tables('NOTES_APP')/rows");NROWS=d.value.map(x=>x.values[0]);NT=true;NROWS.forEach(r=>{if(!NXT||r[5]==="A_APPLIQUER")pend[r[0]+S+r[1]+S+r[2]]=String(r[3]||"")})}catch(e){NROWS=[];NT=false}
 NOTES=Object.assign({},NX);for(const k in pend){if(pend[k])NOTES[k]=pend[k];else delete NOTES[k]}
 let ch=false;for(const k in CACHE){if(k in pend)continue;const c=CACHE[k],t=typeof c==="string"?c:c.t;
  if(!NXT){if(t)NOTES[k]=t;continue}

 function dTab(s){const r=7.8*s.k,a=Math.max(.2,Math.abs(Math.cos(s.t))),dy=r*.26*Math.sqrt(1-a*a)+1.2;cx.rotate(s.a);

 function dLogo(s){const R=34*s.k*(s.sc||1),c=Math.cos(s.t),a=Math.max(.06,Math.abs(c)),sn=Math.sin(s.t),th=R*.16*Math.abs(sn),dir=sn>=0?1:-1,gl=Math.pow(Math.max(0,Math.sin(s.gl+T*2.4)),9);

 function mol(){if(!box||box.childElementCount>7)return;const e=document.createElement("span");e.className="mol";e.textContent=pick(MOL);e.style.left=rnd(4,Math.max(8,(W-110)/W*100))+"%";e.style.top=rnd(14,86)+"%";e.style.fontSize=rnd(10,13)+"px";e.style.animationDuration=rnd(2.2,3.4)+"s";e.addEventListener("animationend",()=>e.remove());box.appendChild(e)}
 function frame(ts){raf=requestAnimationFrame(frame);const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;T+=dt;

   if(kind=="money"){s.age+=dt;s.y+=s.vy*dt;s.t=s.st+T*s.vs;s.a=Math.sin(s.sw+T*s.sf*.5)*.1;const ap=Math.min(1,s.age/.75),dp=Math.min(1,(s.life-s.age)/.85);al=Math.min(ap,dp);if(fade)al=Math.min(al,1-(T-fade)/.45);s.sc=(.35+.65*(1-Math.pow(1-ap,3)))*(1+.22*(1-Math.max(0,Math.min(1,dp))));if(al<=0||s.age>s.life){P.splice(i,1);continue}}
   else{s.vy=Math.min(s.vy+G*dt,VT);s.x+=s.vx*dt+Math.cos(s.sw+T*s.sf)*s.sa*dt;s.y+=s.vy*dt;s.t+=s.vt*dt;s.ro+=s.vr*dt;s.a+=s.va*dt;
    if(fade){if(s.fd===undefined)s.fd=fade+rnd(0,2.4);al=s.fd>T?1:1-(T-s.fd)/1.3;if(al<=0){P.splice(i,1);continue}}

   s.al=Math.max(0,al);draw(s)}
  if(!em&&!P.length){stopMol();cv.classList.remove("on");cancelAnimationFrame(raf);raf=0;cv.style.display="none"}}

 function start(k){init();if(k!="pills")buildArt();const me=++id;kind=k;em=true;acc=0;P=[];fade=0;for(let i=0;i<(k=="pills"?(red?6:26):(red?2:5));i++)make(true);cv.style.display="block";requestAnimationFrame(()=>cv.classList.add("on"));minEnd=performance.now()+4600;
