<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f24"><title>Gestion Pharmacie - EPHD Sandégué 2027</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pharmacie EPHD">
<style>
:root{--bg:#0b1f24;--card:#12323a;--tx:#e8fbff;--mut:#8fb5bd;--ac:#3AFEEB;--ko:#ff6b6b;--ok:#4be38a;--or:#ffa94d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 50% -100px,#134a52 0,var(--bg) 70%) fixed,var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;z-index:5;border-bottom:1px solid #1e4650;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.lg{width:60px;height:60px;border-radius:16px;box-shadow:0 0 18px rgba(58,254,235,.35),0 0 0 1px rgba(58,254,235,.35)}
h1{flex:1;font-size:17px;line-height:1.2;margin:0;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#fff,#3AFEEB);-webkit-background-clip:text;background-clip:text;color:transparent}
.rf{width:54px;height:54px;border-radius:50%;padding:0;display:grid;place-items:center;color:#04282b;border:0;background:linear-gradient(135deg,#3AFEEB,#4be38a);box-shadow:0 0 16px rgba(58,254,235,.55),inset 0 0 0 2px rgba(255,255,255,.35)}
.rf:active{transform:scale(.92)}.rf.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.srow #st{margin:0;flex:1}.out{padding:7px 16px;font-size:12px;font-weight:700;letter-spacing:.4px;color:#ffd0d0;border:1px solid #8a4048;border-radius:999px;background:linear-gradient(135deg,#43202a,#2a1519);box-shadow:0 2px 10px rgba(255,107,107,.12);white-space:nowrap;transition:transform .15s,background .2s,box-shadow .2s}.out:hover{box-shadow:0 2px 14px rgba(255,107,107,.3)}.out:active{transform:scale(.95);background:#5a2a30}
.row{display:flex;gap:8px}select,input,button,textarea{font:inherit;border-radius:10px;border:1px solid #1e4650;background:var(--card);color:var(--tx);padding:10px}
select,input[type=search]{flex:1;min-width:0}button.p{background:var(--ac);color:#04282b;font-weight:700;border:0}
#st{font-size:12px;color:var(--mut);margin-top:6px}#bar{height:6px;background:#1e4650;border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);width:0}
#fin{background:var(--ok);color:#042a14;font-weight:800;text-align:center;border-radius:10px;padding:8px;margin-top:8px}
main{padding:10px 12px 160px}.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border-left:4px solid #1e4650}
.c.done{border-left-color:var(--ok)}.c.todo{border-left-color:var(--ko)}.c.pend{box-shadow:0 0 0 2px var(--or)}
.t{display:flex;justify-content:space-between;gap:8px;font-weight:600}.n{color:var(--ac);font-weight:700}.m{color:var(--mut);font-size:13px;margin:4px 0 8px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f label{font-size:11px;color:var(--mut)}.f input{width:100%;padding:8px}
.cm{margin-top:6px;font-size:13px}.nbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk{background:none;border:1px solid #1e4650;color:var(--ac);padding:6px 2px;font-size:12px}.lk.or{border-color:var(--or);color:var(--or)}
.nb{margin-top:6px}.nb textarea{width:100%;font-size:14px}.nb small{color:var(--mut)}
#act{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:8px 12px;background:linear-gradient(transparent,var(--bg) 40%);text-align:center}
#act button{font-size:14px;padding:12px 22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e2a31;border-top:1px solid #1e4650;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:14px}nav button.on{color:var(--ac);font-weight:700}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.k div{background:var(--card);border-radius:12px;padding:12px}
.k small{color:var(--mut);font-size:11px;display:block;text-transform:uppercase}.k b{font-size:18px}.k .w{grid-column:1/-1}
h2{color:var(--or);font-size:18px;margin:4px 0 10px}.sc{overflow-x:auto;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #1e4650;padding:6px;white-space:nowrap;text-align:center}th{background:#0e2a31}td:first-child,th:first-child{position:sticky;left:0;background:#0e2a31;text-align:left}
td input{width:92px;padding:6px;text-align:right}td input.pd{outline:2px solid var(--or)}
.ring{display:block;margin:6px auto 14px}.hide{display:none!important}#login{text-align:center;padding:60px 20px}#login img{width:170px;border-radius:40px;box-shadow:0 0 40px rgba(58,254,235,.35)}#login h1{margin:16px 0;font-size:22px}
.sv th,.sv td{white-space:normal;min-width:104px;font-size:12px;font-weight:600}.sv td:first-child,.sv th:first-child{min-width:128px}.sv .h th,.sv .h td{background:#0f4d3c;color:#e8fbff}.sv .a td{background:#33261a}.sv .v td{background:#143a4c}.sv .s td{background:#143f2f}.sv .e td{background:#33161f}
.tt{font-weight:700;background:#0e2a31}

/* ---- Bilan : colonne des libellés + colonne Total ---- */
.bt{border-collapse:separate;border-spacing:0}.bt th,.bt td{border:0;border-bottom:1px solid #1e4650;border-right:1px solid #173a43}
.bt th{background:#0e2a31;color:var(--mut);font-weight:600;font-size:12px}
.bt th:first-child{background:linear-gradient(135deg,#0f6b5a,#13997a);color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.5px;border-right:2px solid var(--ac)}
.bt td.lb{position:sticky;left:0;z-index:2;color:#eafff6;font-weight:700;font-size:12px;white-space:normal;min-width:116px;background:linear-gradient(90deg,#0d5a49,#12745c);border-right:2px solid var(--ac);box-shadow:inset 4px 0 0 var(--lc,#3AFEEB)}
.bt tr.r1{--lc:#5aa9ff}.bt tr.r2{--lc:#ffa94d}.bt tr.r3{--lc:#4be38a}
.bt tr.r1 td:not(.lb):not(.tt){background:#0f2f3d}.bt tr.r2 td:not(.lb):not(.tt){background:#2b2319}.bt tr.r3 td:not(.lb):not(.tt){background:#102e26}
.bt th:last-child,.bt td.tt{position:sticky;right:0;z-index:2;border-left:2px solid #f2c14e}
.bt th:last-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.bt td.tt{background:linear-gradient(135deg,#3b2b08,#5e4512);color:#ffd77a;font-weight:800;font-size:13px;min-width:92px}
.bt td input{background:rgba(4,24,30,.55)}
.k .tv{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#3AFEEB,#ffd77a 50%,#4be38a) border-box;box-shadow:0 0 18px rgba(58,254,235,.28),0 0 28px rgba(255,215,122,.15);animation:glow 3.2s ease-in-out infinite}
.k .tv small{color:#ffd77a}.k .tv b{color:#fff}
@keyframes glow{50%{box-shadow:0 0 26px rgba(58,254,235,.5),0 0 38px rgba(255,215,122,.3)}}
/* ---- Recouvrement : colonne SOLDE ---- */
.sv tr>:last-child{position:sticky;right:0;z-index:2;border-left:2px solid #f2c14e;font-weight:800;background:linear-gradient(135deg,#3b2b08,#5e4512);color:#ffd77a}
.sv tr.h>:last-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;text-transform:uppercase;letter-spacing:.5px}
.sv tr:not(.h)>:first-child{box-shadow:inset 3px 0 0 var(--lc,#3AFEEB)}.sv tr.a{--lc:#ffa94d}.sv tr.v{--lc:#5aa9ff}.sv tr.s{--lc:#4be38a}
.fn{color:var(--mut);font-size:12px;margin:8px 2px}
/* ---- Animation d'envoi ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none;background:rgba(3,18,22,0);transition:background .45s}#fx.on{background:rgba(3,18,22,.4)}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:51;padding:14px 22px;border-radius:18px;background:rgba(10,40,46,.92);border:1px solid var(--ac);color:#fff;font-weight:800;font-size:17px;text-align:center;box-shadow:0 0 30px rgba(58,254,235,.45);opacity:0;pointer-events:none;max-width:84vw}
#toast.go{animation:pop 2.2s ease forwards}@keyframes pop{12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* ---- v3 : boutons (sombre sans modification, actif avec modification) ---- */
#act button.p{transition:background .3s,color .3s,box-shadow .3s,border-color .3s;border:1px solid transparent}
#act button.p:not(:disabled){box-shadow:0 0 18px rgba(58,254,235,.35)}
#act button.p:disabled{background:linear-gradient(135deg,#08242a,#0d343b);color:#5e8b93;border:1px solid #1b4750;box-shadow:none;cursor:default}
/* ---- v3 : Bilan ---- */
.k{margin-bottom:34px}
.bt td input{text-align:center}
.bt td.lb{box-shadow:inset 5px 0 0 var(--lc,#3AFEEB)}
.bt td.tt{border-left:2px solid var(--lc,#f2c14e)}
.bt tr.r1 td.tt{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.bt tr.r2 td.tt{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.bt tr.r3 td.tt{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
/* ---- v3 : Recouvrement ---- */
.sv tr.e{--lc:#ff7a9c}
.sv tr:not(.h)>:last-child{border-left:2px solid var(--lc,#f2c14e)}
.sv tr.a>:last-child{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.sv tr.v>:last-child{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.sv tr.s>:last-child{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.e>:last-child{background:linear-gradient(135deg,#4a1226,#80233f);color:#ffb8cb}
.ring{display:block;overflow:visible;max-width:100%;height:auto;shape-rendering:geometricPrecision;text-rendering:geometricPrecision}
.ring text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-kerning:normal}
.ring .pg{animation:ringin 1.7s cubic-bezier(.22,.8,.2,1) both}
@keyframes ringin{from{stroke-dasharray:0 440}}
.ring .hz{animation:ringin 1.7s cubic-bezier(.22,.8,.2,1) both,twk 3.2s ease-in-out 1.7s infinite}
@keyframes twk{0%,100%{opacity:.30}18%{opacity:.62}34%{opacity:.38}55%{opacity:.70}78%{opacity:.34}}
.ring .dg{transform-box:view-box;transform-origin:90px 90px;animation:dotin 1.7s cubic-bezier(.22,.8,.2,1) both}
@keyframes dotin{from{transform:rotate(0deg)}to{transform:rotate(var(--ang))}}
.ring .hl{transform-box:fill-box;transform-origin:center;animation:dotpulse 3.2s ease-out infinite}
@keyframes dotpulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.55);opacity:0}}
.ring .tk{opacity:.55;animation:tkspin 24s linear infinite;transform-box:view-box;transform-origin:90px 90px}
@keyframes tkspin{to{transform:rotate(360deg)}}
/* ---- v3 : noms de molécules pendant l'envoi ---- */
#mols{position:fixed;inset:0;pointer-events:none;z-index:52;overflow:hidden}
.mol{position:absolute;white-space:nowrap;font:600 11px/1 system-ui,sans-serif;letter-spacing:.4px;color:#c4fff7;text-shadow:0 0 6px rgba(58,254,235,.8);opacity:0;animation:molf 2.8s ease-in-out forwards}
@keyframes molf{0%{opacity:0;transform:translateY(8px) scale(.92)}25%{opacity:.95}70%{opacity:.85}100%{opacity:0;transform:translateY(-12px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.ring,.ring .pg,.ring .hz,.ring .dg,.ring .hl,.ring .tk{animation:none}}
/* ---- v4 ---- */
.bt th:first-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;border-right:2px solid #f2c14e}
.bt td.lb{border-right:2px solid var(--lc,#f2c14e)}
.bt tr.r1 td.lb{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.bt tr.r2 td.lb{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.bt tr.r3 td.lb{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.h>:first-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.sv tr:not(.h)>:first-child{font-weight:800;border-right:2px solid var(--lc,#f2c14e)}
.sv tr.a>:first-child{background:linear-gradient(135deg,#43260a,#7c4a12);color:#ffd0a0}
.sv tr.v>:first-child{background:linear-gradient(135deg,#0a2a47,#145286);color:#a9d4ff}
.sv tr.s>:first-child{background:linear-gradient(135deg,#093b29,#12694a);color:#9bffc8}
.sv tr.e>:first-child{background:linear-gradient(135deg,#4a1226,#80233f);color:#ffb8cb}
.sv tr.e>td:not(:first-child):not(:last-child){background:#33161f}
.sv tr:not(.h)>:nth-child(2){color:#ffb8cb}
.sv tr:not(.h){height:56px}.sv tr:not(.h)>td{vertical-align:middle}

/* ===== BILAN : tableau des versements, lisibilité alignée sur le tableau de Recouvrement (.sv) ===== */
.bt{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.bt th,.bt td{white-space:normal;min-width:104px;font-size:13px;font-weight:700;text-align:center;padding:11px 8px;letter-spacing:.1px}
.bt th{background:#0f4d3c;color:#e8fbff;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid rgba(232,251,255,.16)}
.bt th:first-child{min-width:128px;color:#2b1c00}
.bt td.lb{min-width:128px;font-weight:800;font-size:12.5px;color:#fff}
.bt tr.r1 td:not(.lb):not(.tt){background:#143a4c;color:#e8fbff}
.bt tr.r2 td:not(.lb):not(.tt){background:#33261a;color:#ffe9d2}
.bt tr.r3 td:not(.lb):not(.tt){background:#143f2f;color:#dcffee}
.bt td input{color:#fff;font-size:14px;font-weight:800;min-width:92px;text-shadow:none;background:rgba(2,16,22,.62);border:1px solid rgba(232,251,255,.28)}
.bt td input:focus{border-color:#3AFEEB;box-shadow:0 0 0 2px rgba(58,254,235,.35)}
.bt td.tt{font-size:14px;font-weight:900;min-width:100px}
.bt tr:not(:last-child) td{border-bottom:1px solid rgba(232,251,255,.16)}

/* ===== v5 : Bilan - lignes 2, 3 et 4 de même hauteur ===== */
.bt td{vertical-align:middle}.bt td input{box-sizing:border-box;height:38px}
.bt tr:not(:first-child){height:60px}
/* ===== v5 : Recouvrement - séparations fixes (comme le tableau des versements) ===== */
.sv{border-collapse:separate;border-spacing:0}
.sv th,.sv td{border:0;border-bottom:1px solid #1e4650;border-right:1px solid #173a43;vertical-align:middle}
.sv th{padding:11px 8px;font-weight:800;letter-spacing:.4px}
.sv tr:not(:last-child)>td{border-bottom:1px solid rgba(232,251,255,.16)}
.sv tr>:first-child,.sv tr>:last-child{z-index:2}
.sv tr.h>:first-child{border-right:2px solid #f2c14e}
.sv tr.h>:last-child{border-left:2px solid #f2c14e}
.sv tr:not(.h)>:first-child{border-right:2px solid var(--lc,#f2c14e)}
.sv tr:not(.h)>:last-child{border-left:2px solid var(--lc,#f2c14e)}

/* ===== v6 : onglet RÉCAPITULATIF ===== */
nav button{font-size:12.5px;white-space:nowrap}
:root{--hh:120px}
.rc-nav{position:sticky;top:var(--hh);z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0 10px;background:linear-gradient(var(--bg) 82%,transparent)}
.rc-nav button{padding:9px 2px;font-size:12px;font-weight:700;white-space:nowrap;border-radius:999px;background:#0e2a31;color:var(--mut);border:1px solid #1e4650}
.rc-nav button.on{background:linear-gradient(135deg,#3AFEEB,#4be38a);color:#04282b;border-color:transparent;box-shadow:0 0 14px rgba(58,254,235,.35)}
.rc-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.rc-k div{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;border-top:3px solid var(--c,#3AFEEB)}
.rc-k small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
.rc-k b{font-size:20px}
details.rc-c{background:var(--card);border-radius:14px;margin-bottom:10px;border-left:4px solid var(--c,#3AFEEB);overflow:hidden}
details.rc-c>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;font-weight:800;font-size:13px;letter-spacing:.2px;cursor:pointer}
details.rc-c>summary::-webkit-details-marker{display:none}
details.rc-c>summary b{min-width:32px;text-align:center;padding:3px 9px;border-radius:999px;background:var(--c,#3AFEEB);color:#04282b;font-size:13px}
details.rc-c ul{list-style:none;margin:0;padding:0 8px 8px}
details.rc-c li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid #1a4049;font-size:13px}
details.rc-c li .nm{font-weight:600;overflow-wrap:anywhere}details.rc-c li .q{color:var(--c,#3AFEEB);font-weight:800;white-space:nowrap;font-size:12px;text-align:right}
.rc-e{margin:0;padding:0 12px 12px;color:var(--mut);font-size:13px}
.rc-ok{--c:#4be38a}.rc-urg{--c:#ff6b6b}.rc-sug{--c:#ffa94d}.rc-rup{--c:#b794ff}
.rc-ctl{display:flex;gap:8px;align-items:center;margin-bottom:10px}.rc-ctl select{flex:1}.rc-ctl.dis select{opacity:.45}
.rc-seg{display:flex;border:1px solid #1e4650;border-radius:10px;overflow:hidden}
.rc-seg button{border:0;border-radius:0;background:#0e2a31;color:var(--mut);padding:10px 12px;font-size:13px;font-weight:700}.rc-seg button.on{background:var(--ac);color:#04282b}
.rc-s{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.rc-s h3{margin:0 0 2px;font-size:13px;letter-spacing:.3px;color:#ffd77a}.rc-s .sb{color:var(--mut);font-size:11px;margin-bottom:8px}
.rc-s ol{list-style:none;margin:0;padding:0}.rc-s li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #1a4049;font-size:12.5px}
.rk{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:11px;background:#0e2a31;color:var(--ac)}
.rc-s li:nth-child(-n+3) .rk{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00}
.rb{flex:1;min-width:0}.rb .nm{display:block;font-weight:600;overflow-wrap:anywhere}.bar{display:block;height:5px;border-radius:3px;background:#0e2a31;margin-top:4px;overflow:hidden}
.bar s{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3AFEEB,#4be38a);animation:grow .9s ease both}@keyframes grow{from{width:0!important}}
.vl{font-size:12px;text-align:right;white-space:nowrap}.vl small{display:block;color:var(--mut);font-weight:600}
.rc-s li.m80{box-shadow:inset 0 -2px 0 #ffd77a}.tag80{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#ffd77a;color:#2b1c00;font-size:10px;font-weight:800}
.rc-btn{width:100%;margin-top:10px;padding:11px;font-weight:700;color:var(--ac);background:#0e2a31;border:1px solid var(--ac)}.rc-btn.on{background:var(--ac);color:#04282b}
.rc-ch{margin-top:10px;background:#0b2a31;border-radius:12px;padding:8px 6px}.rc-ch svg{display:block;width:100%;height:auto}
.rc-ch text{font-family:system-ui,sans-serif;fill:#b9d6db;font-size:8.5px}.rc-ch .tt{fill:#fff;font-weight:800;font-size:10px}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin:6px 4px 2px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
