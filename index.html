<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f24"><title>Gestion Pharmacie</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pharmacie">
<style>
:root{--bg:#0b1f24;--card:#12323a;--tx:#e8fbff;--mut:#8fb5bd;--ac:#3AFEEB;--ko:#ff6b6b;--ok:#4be38a;--or:#ffa94d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;z-index:5;border-bottom:1px solid #1e4650}
h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}h1 span{display:flex;align-items:center;gap:8px}h1 img{width:28px;height:28px}
.row{display:flex;gap:8px}select,input,button,textarea{font:inherit;border-radius:10px;border:1px solid #1e4650;background:var(--card);color:var(--tx);padding:10px}
select,input[type=search]{flex:1;min-width:0}button.p{background:var(--ac);color:#04282b;font-weight:700;border:0}
#st{font-size:12px;color:var(--mut);margin-top:6px}#bar{height:6px;background:#1e4650;border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);width:0}
#fin{background:var(--ok);color:#042a14;font-weight:800;text-align:center;border-radius:10px;padding:8px;margin-top:8px}
main{padding:10px 12px 160px}.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border-left:4px solid #1e4650}
.c.done{border-left-color:var(--ok)}.c.todo{border-left-color:var(--ko)}.c.pend{box-shadow:0 0 0 2px var(--or)}
.t{display:flex;justify-content:space-between;gap:8px;font-weight:600}.n{color:var(--ac);font-weight:700}.m{color:var(--mut);font-size:13px;margin:4px 0 8px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f label{font-size:11px;color:var(--mut)}.f input{width:100%;padding:8px}
.cm{margin-top:6px;font-size:13px}.nbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk{background:none;border:1px solid #1e4650;color:var(--ac);padding:6px 2px;font-size:12px}.lk.or{border-color:var(--or);color:var(--or)}
.nb{margin-top:6px}.nb textarea{width:100%;font-size:14px}.nb small{color:var(--mut)}
#act{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:8px 12px;background:linear-gradient(transparent,var(--bg) 40%);text-align:center}
#act button{font-size:14px;padding:12px 22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e2a31;border-top:1px solid #1e4650;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:14px}nav button.on{color:var(--ac);font-weight:700}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.k div{background:var(--card);border-radius:12px;padding:12px}
.k small{color:var(--mut);font-size:11px;display:block;text-transform:uppercase}.k b{font-size:18px}.k .w{grid-column:1/-1}
h2{color:var(--or);font-size:18px;margin:4px 0 10px}.sc{overflow-x:auto;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #1e4650;padding:6px;white-space:nowrap;text-align:center}th{background:#0e2a31}td:first-child,th:first-child{position:sticky;left:0;background:#0e2a31;text-align:left}
td input{width:92px;padding:6px;text-align:right}td input.pd{outline:2px solid var(--or)}
.ring{display:block;margin:6px auto 14px}.hide{display:none!important}#login{text-align:center;padding:60px 20px}#login img{width:96px}
</style></head><body>
<div id="login"><img src="icon-192.png" alt=""><h1 style="justify-content:center">Gestion Pharmacie</h1><p>Connectez-vous avec votre compte Microsoft pour accéder au classeur.</p><button class="p" onclick="signIn()">Se connecter</button><p id="err" style="color:var(--ko)"></p></div>
<div id="app" class="hide">
<header><h1><span><img src="icon-192.png" alt="">Gestion Pharmacie</span><button onclick="load()" title="Recharger">⟳</button></h1>
<div class="row"><select id="mois" onchange="load()"></select><select id="mode" onchange="render()"><option value="pos">Ordre magasin</option><option value="todo">À inventorier</option><option value="vente">Plus vendus</option></select></div>
<div id="sf"><div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Rechercher un produit…" oninput="render()"></div></div>
<div id="st"></div><div id="bar"><i></i></div><div id="fin" class="hide">✔ INVENTAIRE TERMINÉ</div></header>
<main id="main"></main>
<div id="act"><button id="b-stock" class="p" onclick="valider()">Je valide l'inventaire.</button><button id="b-bilan" class="p hide" onclick="validerB()">Je valide les versements</button></div>
<nav><button id="t-stock" class="on" onclick="tab('stock')">📦 Stock</button><button id="t-bilan" onclick="tab('bilan')">💰 Bilan</button><button id="t-rec" onclick="tab('rec')">📈 Recouvrement</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
/* ====== CONFIGURATION ====== */
const CLIENT_ID = "2fd34dea-3839-4d3c-ad3b-6e08817b507a";
const FILE_PATH = "/Gestion Pharma FP/O_PHARMA_2027.xlsm";
/* =========================== */
const MOIS=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
const EDIT=["STOCK ENTRÉ","STOCK INVENTORIÉ","PERTES"],ELAB=["Entré","Inventorié","Pertes"];
const pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];
const $=id=>document.getElementById(id),enc=encodeURIComponent,S="§",J=JSON.stringify;
const num=v=>typeof v==="number"?Math.round(v).toLocaleString("fr-FR"):(v||"0");const fcfa=v=>num(v)+" FCFA";
let token,H=[],R=[],origin={row:5,col:0},editing=false,cur="stock",NOTES={},NROWS=[],NT=false,BIL=null;
let P=Object.assign({v:{},c:{},b:{}},JSON.parse(localStorage.getItem("op_pend")||"{}"));
const keep=()=>localStorage.setItem("op_pend",J(P));
MOIS.forEach(m=>$("mois").add(new Option(m,m)));$("mois").value=MOIS[new Date().getMonth()];
async function signIn(){try{await pca.loginRedirect({scopes:SCOPES})}catch(e){$("err").textContent=e.message}}
async function tok(){const a=pca.getAllAccounts()[0];if(!a)throw 0;try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES})}}
async function g(path,opt={}){const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${encodeURI(FILE_PATH)}:/workbook${path}`,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error?.message||r.status);return r.json()}
const col=n=>{let s="";n++;while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
const parse=a=>{const m=a.split("!")[1].replace(/\$/g,"").match(/([A-Z]+)(\d+):/);return{row:+m[2],col:[...m[1]].reduce((x,c)=>x*26+c.charCodeAt(0)-64,0)-1}};
const put=(addr,sheet,v)=>g(`/worksheets('${enc(sheet)}')/range(address='${addr}')`,{method:"PATCH",body:J({values:[[v]]})});
function tab(t){cur=t;for(const k of["stock","bilan","rec"])$("t-"+k).classList.toggle("on",k==t);
 const s=t=="stock";$("act").classList.toggle("hide",t=="rec");$("b-stock").classList.toggle("hide",!s);$("b-bilan").classList.toggle("hide",t!="bilan");
 for(const i of["sf","mode","bar"])$(i).classList.toggle("hide",!s);$("fin").classList.add("hide");load()}
async function loadNotes(){try{const d=await g("/tables('NOTES_APP')/rows");NOTES={};NROWS=d.value.map(x=>x.values[0]);NROWS.forEach(r=>{if(r[3])NOTES[r[0]+S+r[1]+S+r[2]]=r[3]});NT=true}catch(e){NOTES={};NROWS=[];NT=false}}
async function load(){if(editing)return;try{token=await tok();const m=$("mois").value;
 if(cur=="stock"){const d=await g(`/tables('STOCK_${enc(m)}')/range`);H=d.values[0];R=d.values.slice(1);origin=parse(d.address);await loadNotes();render();$("st").dataset.t="Synchronisé à "+new Date().toLocaleTimeString("fr-FR")}
 else if(cur=="bilan")await bilan(m);else await recou(m);stat()}catch(e){$("st").textContent="⚠ "+e.message}}
const ix=n=>H.indexOf(n),NK=(p,n)=>$("mois").value+S+p+S+n,pr=r=>r[ix("PRODUITS (DCI)")];
const val=(r,n)=>{const k=NK(pr(r),n);return k in P.v?P.v[k]:r[ix(n)]};
const rows=()=>R.map((r,i)=>({r,i})).filter(x=>pr(x.r)&&String(pr(x.r)).trim().toUpperCase()!=="TOTAL");
function stat(){const np=Object.keys(P.v).length+Object.keys(P.c).length+Object.keys(P.b).length,tail=np?` · ${np} modif. à envoyer`:"";
 if(cur!="stock"){$("st").textContent=(np?`${np} modif. à envoyer`:"")+($("st").dataset.s||"");return}
 const all=rows(),f=all.filter(x=>val(x.r,"STOCK INVENTORIÉ")!=="").length;$("bar").firstChild.style.width=(all.length?100*f/all.length:0)+"%";
 $("st").textContent=`${f}/${all.length} inventoriés`+(all.length&&f==all.length?"":` — reste ${all.length-f}`)+tail+" · "+($("st").dataset.t||"");$("fin").classList.toggle("hide",!(all.length&&f==all.length))}
function render(){if(cur!="stock")return;const iN=ix("N° Pos."),iV=ix("VALEUR VENTE S. SORTI"),iU=ix("UNITE DE COMPTAGE"),iS=ix("STOCK INITIAL");
 const q=$("q").value.toLowerCase(),mode=$("mode").value;let L=rows().filter(x=>String(pr(x.r)).toLowerCase().includes(q));
 if(mode=="todo")L=L.filter(x=>val(x.r,"STOCK INVENTORIÉ")==="");
 L.sort((a,b)=>mode=="vente"?(+b.r[iV]||0)-(+a.r[iV]||0):(+a.r[iN]||999)-(+b.r[iN]||999));
 $("main").innerHTML=L.map(({r,i})=>{const p=pr(r),pend=EDIT.some(n=>NK(p,n) in P.v||NK(p,n) in P.c);
 const nv=n=>{const k=NK(p,n);return k in P.c?P.c[k]:(NOTES[k]||"")};
 return `<div class="c ${val(r,"STOCK INVENTORIÉ")===""?"todo":"done"} ${pend?"pend":""}"><div class="t"><span>${p}</span><span class="n">#${r[iN]}</span></div>
 <div class="m">${r[iU]} · Stock initial : ${r[iS]}</div><div class="f">${EDIT.map(n=>`<div><label>${ELAB[EDIT.indexOf(n)]}</label><input type="number" inputmode="decimal" value="${val(r,n)}" onfocus="editing=true" onblur="editing=false;stat()" oninput="setV(${i},'${n}',this.value)"></div>`).join("")}</div>
 <div class="cm"><div class="nbs" style="margin-top:8px">${EDIT.map((n,j)=>`<button class="lk ${NK(p,n) in P.c?"or":""}" onclick="tn(this,${j})">💬 ${ELAB[j]}${nv(n)?" •":""}</button>`).join("")}</div>
 ${EDIT.map((n,j)=>`<div class="nb hide"><small>Note — ${ELAB[j]}${NK(p,n) in P.c?" (à envoyer)":""}</small><textarea rows="2" placeholder="Note de la cellule…" onfocus="editing=true" onblur="editing=false;stat()" oninput="setC(${i},'${n}',this.value)">${nv(n).replace(/</g,"&lt;")}</textarea></div>`).join("")}</div></div>`}).join("")}
function tn(b,j){b.closest(".cm").querySelectorAll(".nb").forEach((e,x)=>x==j?e.classList.toggle("hide"):e.classList.add("hide"))}
function setV(i,n,v){P.v[NK(pr(R[i]),n)]=v===""?"":Number(v);keep();stat()}
function setC(i,n,v){const k=NK(pr(R[i]),n);v===(NOTES[k]||"")?delete P.c[k]:P.c[k]=v;keep();stat()}
async function ensureNotes(){if(NT)return;await g("/worksheets/add",{method:"POST",body:J({name:"NOTES_APP"})}).catch(()=>{});
 await g("/worksheets('NOTES_APP')/range(address='A1:F1')",{method:"PATCH",body:J({values:[["MOIS","PRODUIT","CHAMP","NOTE","ORIGINE","STATUT"]]})});
 const t=await g("/tables/add",{method:"POST",body:J({address:"NOTES_APP!A1:F1",hasHeaders:true})});
 await g(`/tables('${enc(t.id)}')`,{method:"PATCH",body:J({name:"NOTES_APP"})});NT=true}
async function putNote(m,p,c,txt){await ensureNotes();const i=NROWS.findIndex(r=>r[0]==m&&r[1]==p&&r[2]==c),row=[m,p,c,txt,"APP","A_APPLIQUER"];
 if(i>=0){await g(`/tables('NOTES_APP')/rows/itemAt(index=${i})`,{method:"PATCH",body:J({values:[row]})});NROWS[i]=row}
 else{await g("/tables('NOTES_APP')/rows/add",{method:"POST",body:J({values:[row]})});NROWS.push(row)}}
async function valider(){const m=$("mois").value,b=$("b-stock"),ks=Object.keys(P.v).filter(k=>k.startsWith(m+S)),cs=Object.keys(P.c).filter(k=>k.startsWith(m+S)),tot=ks.length+cs.length;let n=0;
 editing=false;if(!tot)return load();b.disabled=true;
 try{token=await tok();
 for(const k of ks){const[,p,c]=k.split(S),i=R.findIndex(r=>pr(r)===p);if(i<0)continue;await put(col(origin.col+ix(c))+(origin.row+1+i),m,P.v[k]);delete P.v[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}
 if(cs.length){await loadNotes();for(const k of cs){const[,p,c]=k.split(S);await putNote(m,p,c,P.c[k]);delete P.c[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}}
 await load();$("st").dataset.t="✔ Envoyé à "+new Date().toLocaleTimeString("fr-FR");stat()}
 catch(e){$("st").textContent="⚠ Envoi interrompu : "+e.message+" (le reste est conservé)"}b.disabled=false}
async function bilan(m){const d=await g(`/worksheets('${enc(m)}')/range(address='A74:R115')`),V=d.values,r=V.findIndex(x=>x[1]==="DATE DE VERSEMENTS");
 if(r<0){$("main").innerHTML="<p>Bilan financier introuvable.</p>";return}
 const f=l=>V.find(x=>x[1]===l)?.[2],R0=74+r,ec=String(f("ECART")??"–"),bv=(row,j)=>{const k=m+S+row+S+col(j);return k in P.b?P.b[k]:V[row-74][j]};
 const lab=V[r].slice(2,13),inp=(row)=>V[row-74].slice(2,13).map((x,j)=>`<td><input type="number" inputmode="decimal" value="${bv(row,j+2)}" class="${m+S+row+S+col(j+2) in P.b?"pd":""}" onfocus="editing=true" onblur="editing=false;stat()" oninput="setB(${row},${j+2},this.value)"></td>`).join("");
 $("main").innerHTML=`<h2>${V[r-1][2]||"Bilan financier - "+m}</h2><div class="k"><div class="w"><small>Total recette</small><b>${fcfa(f("Total Recette"))}</b></div>
 <div><small>Écart</small><b style="color:${ec[0]=="▲"?"var(--ok)":ec[0]=="▼"?"var(--ko)":"inherit"}">${ec}</b></div><div><small>Montant total versé</small><b>${fcfa(f("MONTANT TOTAL VERSÉ"))}</b></div></div>
 <div class="sc"><table><tr><th>${V[r][1]}</th>${lab.map(x=>`<th>${x}</th>`).join("")}</tr><tr><td>${V[r+1][1]}</td>${inp(R0+1)}</tr><tr><td>${V[r+2][1]}</td>${inp(R0+2)}</tr>
 <tr><td>${V[r+3][1]}</td>${V[r+3].slice(2,13).map(x=>`<td>${num(x)}</td>`).join("")}</tr></table></div><p style="color:var(--mut);font-size:12px">Saisissez les montants versés et les dépenses, puis appuyez sur « Je valide les versements ».</p>`}
function setB(row,j,v){P.b[$("mois").value+S+row+S+col(j)]=v===""?"":Number(v);keep();stat()}
async function validerB(){const m=$("mois").value,b=$("b-bilan"),ks=Object.keys(P.b).filter(k=>k.startsWith(m+S));let n=0;editing=false;if(!ks.length)return load();b.disabled=true;
 try{token=await tok();for(const k of ks){const[,row,c]=k.split(S);await put(c+row,m,P.b[k]);delete P.b[k];keep();$("st").textContent=`Envoi ${++n}/${ks.length}…`}
 await load();$("st").dataset.s=" · ✔ Versements envoyés";stat()}catch(e){$("st").textContent="⚠ Envoi interrompu : "+e.message}b.disabled=false}
async function recou(m){const mi=MOIS.indexOf(m),sv=(await g("/worksheets('SOLVABILIT%C3%89')/range(address='C3:R7')")).values,tx=(await g(`/worksheets('${enc("RÉCAPITULATIF")}')/range(address='AP${27+mi}')`)).values[0][0],
 achat=sv[1][15],report=sv[1][1],ech=sv[4][13],vr=sv[2][15],reste=sv[3][15],t=+tx||0,C=2*Math.PI*52,c=2+mi;
 $("main").innerHTML=`<h2>SUIVI DU RECOUVREMENT – NPSP</h2><svg class="ring" width="170" height="170" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#1e4650" stroke-width="10"/>
 <circle cx="60" cy="60" r="52" fill="none" stroke="#3AFEEB" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*Math.min(t,1)} ${C}" transform="rotate(-90 60 60)"/>
 <text x="60" y="62" text-anchor="middle" fill="#e8fbff" font-size="22" font-weight="700">${Math.round(t*100)}%</text><text x="60" y="76" text-anchor="middle" fill="#4be38a" font-size="5.5">TAUX DE RECOUVREMENT NPSP</text><text x="60" y="84" text-anchor="middle" fill="#4be38a" font-size="5.5">EN ${m}</text></svg>
 <div class="k"><div class="w"><small>Achat</small><b>${fcfa(achat)}</b></div><div><small>Report 2026</small><b>${fcfa(report)}</b></div><div><small>Factures échues</small><b>${fcfa(ech)}</b></div>
 <div><small>Valeur recouvrée</small><b>${fcfa(vr)}</b></div><div><small>Reste à recouvrer</small><b>${fcfa(reste)}</b></div></div>
 <h2 style="font-size:15px">${m}</h2><div class="k"><div><small>Achat (débit)</small><b>${fcfa(sv[1][c])}</b></div><div><small>Versement (crédit)</small><b>${fcfa(sv[2][c])}</b></div><div><small>Solde progressif</small><b>${fcfa(sv[3][c])}</b></div><div><small>Factures échues cumulées</small><b>${fcfa(sv[4][c])}</b></div></div>`}
(async()=>{await pca.handleRedirectPromise();if(pca.getAllAccounts().length){$("login").classList.add("hide");$("app").classList.remove("hide");load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}})();
</script></body></html>
