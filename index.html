<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f24"><title>O_PHARMA 2027</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b1f24;--card:#12323a;--tx:#e8fbff;--mut:#8fb5bd;--ac:#3AFEEB;--ko:#ff6b6b;--ok:#4be38a;--or:#ffa94d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;z-index:5;border-bottom:1px solid #1e4650}
h1{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px}select,input,button,textarea{font:inherit;border-radius:10px;border:1px solid #1e4650;background:var(--card);color:var(--tx);padding:10px}
select,input[type=search]{flex:1;min-width:0}button.p{background:var(--ac);color:#04282b;font-weight:700;border:0}
#st{font-size:12px;color:var(--mut);margin-top:6px}#bar{height:6px;background:#1e4650;border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);width:0}
#fin{background:var(--ok);color:#042a14;font-weight:800;text-align:center;border-radius:10px;padding:8px;margin-top:8px}
main{padding:10px 12px 150px}.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border-left:4px solid #1e4650}
.c.done{border-left-color:var(--ok)}.c.todo{border-left-color:var(--ko)}.c.pend{box-shadow:0 0 0 2px var(--or)}
.t{display:flex;justify-content:space-between;gap:8px;font-weight:600}.n{color:var(--ac);font-weight:700}.m{color:var(--mut);font-size:13px;margin:4px 0 8px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.f label{font-size:11px;color:var(--mut)}.f input{width:100%;padding:8px}
.cm{margin-top:8px;font-size:13px;color:var(--mut)}.cm textarea{width:100%;margin-top:6px;font-size:14px}.cm b{color:var(--tx)}
.lk{background:none;border:0;color:var(--ac);padding:4px 0;font-size:13px}
#act{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));padding:8px 12px;background:linear-gradient(transparent,var(--bg) 40%);text-align:center}
#act button{font-size:14px;padding:12px 22px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0e2a31;border-top:1px solid #1e4650;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:14px}nav button.on{color:var(--ac);font-weight:700}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.k div{background:var(--card);border-radius:12px;padding:12px}
.k small{color:var(--mut);font-size:11px;display:block;text-transform:uppercase}.k b{font-size:18px}.k .w{grid-column:1/-1}
h2{color:var(--or);font-size:18px;margin:4px 0 10px}.sc{overflow-x:auto;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #1e4650;padding:8px;white-space:nowrap;text-align:center}th{background:#0e2a31}td:first-child,th:first-child{position:sticky;left:0;background:#0e2a31;text-align:left}
.ring{display:block;margin:6px auto 14px}.hide{display:none!important}#login{text-align:center;padding:60px 20px}
</style></head><body>
<div id="login"><h1 style="justify-content:center">💊 O_PHARMA 2027</h1><p>Connectez-vous avec votre compte Microsoft pour accéder au classeur.</p><button class="p" onclick="signIn()">Se connecter</button><p id="err" style="color:var(--ko)"></p></div>
<div id="app" class="hide">
<header><h1><span>💊 O_PHARMA 2027</span><button onclick="load()" title="Recharger">⟳</button></h1>
<div class="row"><select id="mois" onchange="load()"></select><select id="mode" onchange="render()"><option value="pos">Ordre magasin</option><option value="todo">À inventorier</option><option value="vente">Plus vendus</option></select></div>
<div id="sf"><div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Rechercher un produit…" oninput="render()"></div></div>
<div id="st"></div><div id="bar"><i></i></div><div id="fin" class="hide">✔ INVENTAIRE TERMINÉ</div></header>
<main id="main"></main>
<div id="act"><button class="p" onclick="valider()">Je valide l'inventaire.</button></div>
<nav><button id="t-stock" class="on" onclick="tab('stock')">📦 Stock</button><button id="t-bilan" onclick="tab('bilan')">💰 Bilan</button><button id="t-rec" onclick="tab('rec')">📈 Recouvrement</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
/* ====== CONFIGURATION ====== */
const CLIENT_ID = "2fd34dea-3839-4d3c-ad3b-6e08817b507a";
const FILE_PATH = "/Gestion Pharma FP/O_PHARMA_2027.xlsm";
/* =========================== */
const MOIS=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
const EDIT=["STOCK ENTRÉ","STOCK INVENTORIÉ","PERTES"];
const pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];
const $=id=>document.getElementById(id), enc=encodeURIComponent, S="§";
const fcfa=v=>(typeof v==="number"?Math.round(v).toLocaleString("fr-FR"):(v||"0"))+" FCFA";
let token,H=[],R=[],origin={row:5,col:0},editing=false,cur="stock",CM={};
let P=JSON.parse(localStorage.getItem("op_pend")||'{"v":{},"c":{}}');
const keep=()=>localStorage.setItem("op_pend",JSON.stringify(P));
MOIS.forEach(m=>$("mois").add(new Option(m,m)));$("mois").value=MOIS[new Date().getMonth()];
async function signIn(){try{await pca.loginRedirect({scopes:SCOPES})}catch(e){$("err").textContent=e.message}}
async function tok(){const a=pca.getAllAccounts()[0];if(!a)throw 0;
 try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES})}}
async function g(path,opt={},ver="v1.0"){const r=await fetch(`https://graph.microsoft.com/${ver}/me/drive/root:${encodeURI(FILE_PATH)}:/workbook${path}`,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error?.message||r.status);return r.json()}
const col=n=>{let s="";n++;while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
function parse(a){const m=a.split("!")[1].replace(/\$/g,"").match(/([A-Z]+)(\d+):/);return{row:+m[2],col:[...m[1]].reduce((x,c)=>x*26+c.charCodeAt(0)-64,0)-1}}
function tab(t){cur=t;for(const k of["stock","bilan","rec"])$("t-"+k).classList.toggle("on",k==t);
 $("act").classList.toggle("hide",t!="stock");$("sf").classList.toggle("hide",t!="stock");$("mois").classList.toggle("hide",t=="rec");$("mode").classList.toggle("hide",t!="stock");
 $("bar").classList.toggle("hide",t!="stock");$("fin").classList.add("hide");load()}
async function load(){if(editing)return;try{token=await tok();const m=$("mois").value;
 if(cur=="stock"){const d=await g(`/tables('STOCK_${enc(m)}')/range`);H=d.values[0];R=d.values.slice(1);origin=parse(d.address);
  try{const c=await g("/comments",{},"beta");CM={};(c.value||[]).forEach(x=>{const a=(x.cellAddress||"").split("!");if(a[0]==m){(CM[a[1].replace(/\D/g,"")]??=[]).push(x.content)}})}catch(e){}
  render()}
 else if(cur=="bilan")await bilan(m);else await recou();
 if(cur!="stock")$("st").textContent="";
 else $("st").dataset.t="Synchronisé à "+new Date().toLocaleTimeString("fr-FR");stat()}
 catch(e){$("st").textContent="⚠ "+e.message}}
const ix=n=>H.indexOf(n),kk=(p,n)=>$("mois").value+S+p+S+n;
const val=(r,n)=>{const k=kk(r[ix("PRODUITS (DCI)")],n);return k in P.v?P.v[k]:r[ix(n)]};
function rows(){const iP=ix("PRODUITS (DCI)");return R.map((r,i)=>({r,i})).filter(x=>x.r[iP]&&String(x.r[iP]).trim().toUpperCase()!=="TOTAL")}
function stat(){if(cur!="stock")return;const all=rows(),f=all.filter(x=>val(x.r,"STOCK INVENTORIÉ")!=="").length,np=Object.keys(P.v).length+Object.keys(P.c).length;
 $("bar").firstChild.style.width=(all.length?100*f/all.length:0)+"%";
 $("st").textContent=`${f}/${all.length} inventoriés`+(all.length&&f==all.length?"":` — reste ${all.length-f}`)+(np?` · ${np} modif. à envoyer`:"")+" · "+($("st").dataset.t||"");
 $("fin").classList.toggle("hide",!(all.length&&f==all.length))}
function render(){if(cur!="stock")return;const iP=ix("PRODUITS (DCI)"),iN=ix("N° Pos."),iV=ix("VALEUR VENTE S. SORTI"),iU=ix("UNITE DE COMPTAGE"),iS=ix("STOCK INITIAL");
 const q=$("q").value.toLowerCase(),mode=$("mode").value;let L=rows().filter(x=>String(x.r[iP]).toLowerCase().includes(q));
 if(mode=="todo")L=L.filter(x=>val(x.r,"STOCK INVENTORIÉ")==="");
 L.sort((a,b)=>mode=="vente"?(+b.r[iV]||0)-(+a.r[iV]||0):(+a.r[iN]||999)-(+b.r[iN]||999));
 $("main").innerHTML=L.map(({r,i})=>{const p=r[iP],ck=kk(p,"#"),ad=origin.row+1+i,old=CM[ad]||[],pend=EDIT.some(n=>kk(p,n) in P.v)||ck in P.c;
 return `<div class="c ${val(r,"STOCK INVENTORIÉ")===""?"todo":"done"} ${pend?"pend":""}"><div class="t"><span>${p}</span><span class="n">#${r[iN]}</span></div>
 <div class="m">${r[iU]} · Stock initial : ${r[iS]}</div><div class="f">${EDIT.map(n=>`<div><label>${n.replace("STOCK ","")}</label><input type="number" inputmode="decimal" value="${val(r,n)}" onfocus="editing=true" onblur="editing=false;stat()" oninput="setV(${i},'${n}',this.value)"></div>`).join("")}</div>
 <div class="cm">${old.map(c=>`<div>💬 <b>${c.replace(/</g,"&lt;")}</b></div>`).join("")}<button class="lk" onclick="this.nextElementSibling.classList.toggle('hide')">💬 ${ck in P.c?"Commentaire à envoyer":"Ajouter un commentaire"}</button>
 <textarea class="${ck in P.c?"":"hide"}" rows="2" placeholder="Commentaire…" onfocus="editing=true" onblur="editing=false" oninput="setC(${i},this.value)">${P.c[ck]||""}</textarea></div></div>`}).join("")}
function setV(i,n,v){P.v[kk(R[i][ix("PRODUITS (DCI)")],n)]=v===""?"":Number(v);keep();stat()}
function setC(i,v){const k=kk(R[i][ix("PRODUITS (DCI)")],"#");v.trim()?P.c[k]=v:delete P.c[k];keep();stat()}
async function valider(){if(cur!="stock")return;const m=$("mois").value,b=document.querySelector("#act button");
 const ks=Object.keys(P.v).filter(k=>k.startsWith(m+S)),cs=Object.keys(P.c).filter(k=>k.startsWith(m+S)),tot=ks.length+cs.length;let n=0;
 if(!tot){editing=false;return load()}b.disabled=true;
 try{token=await tok();
 for(const k of ks){const[,p,c]=k.split(S),i=R.findIndex(r=>r[ix("PRODUITS (DCI)")]===p);if(i<0)continue;
  await g(`/worksheets('${enc(m)}')/range(address='${col(origin.col+ix(c))}${origin.row+1+i}')`,{method:"PATCH",body:JSON.stringify({values:[[P.v[k]]]})});
  delete P.v[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}
 for(const k of cs){const[,p]=k.split(S),i=R.findIndex(r=>r[ix("PRODUITS (DCI)")]===p);
  await g("/comments",{method:"POST",body:JSON.stringify({content:`[${m}!${col(origin.col+ix("STOCK INVENTORIÉ"))}${origin.row+1+i}] ${p} : ${P.c[k]}`,contentType:"plain"})},"beta");
  delete P.c[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}
 editing=false;await load();$("st").dataset.t="✔ Envoyé à "+new Date().toLocaleTimeString("fr-FR");stat()}
 catch(e){$("st").textContent="⚠ Envoi interrompu : "+e.message+" (les modifications restantes sont conservées)"}b.disabled=false}
async function bilan(m){const d=await g(`/worksheets('${enc(m)}')/range(address='A74:R115')`),V=d.values,r=V.findIndex(x=>x[1]==="DATE DE VERSEMENTS");
 if(r<0){$("main").innerHTML="<p>Bilan financier introuvable.</p>";return}
 const lab=V[r].slice(2,14),lines=[1,2,3].map(j=>V[r+j]),f=(l)=>V.find(x=>x[1]===l)?.[2],tot=j=>V[r+j][13];
 $("main").innerHTML=`<h2>${V[r-1][2]||"Bilan financier - "+m}</h2><div class="k"><div><small>Montants versés</small><b>${fcfa(tot(1))}</b></div><div><small>Dépenses</small><b>${fcfa(tot(2))}</b></div><div class="w"><small>Recettes (recette des caissières)</small><b>${fcfa(tot(3))}</b></div>
 <div><small>Recette mensuelle</small><b>${fcfa(f("Recette Mensuelle"))}</b></div><div><small>Total recette</small><b>${fcfa(f("Total Recette"))}</b></div></div>
 <div class="sc"><table><tr><th>${V[r][1]}</th>${lab.map(x=>`<th>${x}</th>`).join("")}</tr>${lines.map(l=>`<tr><td>${l[1]}</td>${l.slice(2,14).map(x=>`<td>${typeof x==="number"?Math.round(x).toLocaleString("fr-FR"):x||"–"}</td>`).join("")}</tr>`).join("")}</table></div>`}
async function recou(){const d=await g(`/worksheets('${enc("RÉCAPITULATIF")}')/range(address='AM44:AP57')`),v=d.values,
 A=+v[1][0]||0,Rp=+v[3][3]||0,Fe=+v[4][3]||0,Vr=+v[8][0]||0,Rs=+v[13][0]||0,t=A?Vr/A:0,C=2*Math.PI*52;
 $("main").innerHTML=`<h2>SUIVI DU RECOUVREMENT – NPSP</h2><svg class="ring" width="170" height="170" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#1e4650" stroke-width="10"/>
 <circle cx="60" cy="60" r="52" fill="none" stroke="#3AFEEB" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*Math.min(t,1)} ${C}" transform="rotate(-90 60 60)"/>
 <text x="60" y="62" text-anchor="middle" fill="#e8fbff" font-size="22" font-weight="700">${(t*100).toFixed(t*100%1?1:0)}%</text><text x="60" y="78" text-anchor="middle" fill="#4be38a" font-size="6">TAUX DE RECOUVREMENT NPSP</text></svg>
 <div class="k"><div class="w"><small>Achat</small><b>${fcfa(A)}</b></div><div><small>Report 2026</small><b>${fcfa(Rp)}</b></div><div><small>Factures échues</small><b>${fcfa(Fe)}</b></div>
 <div><small>Valeur recouvrée</small><b>${fcfa(Vr)}</b></div><div><small>Reste à recouvrer</small><b>${fcfa(Rs)}</b></div></div>`}
(async()=>{await pca.handleRedirectPromise();if(pca.getAllAccounts().length){$("login").classList.add("hide");$("app").classList.remove("hide");load();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}})();
</script></body></html>
