<style>

.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.srow #st{margin:0;flex:1}.out{padding:7px 16px;font-size:12px;font-weight:700;letter-spacing:.4px;color:#ffd0d0;border:1px solid #8a4048;border-radius:999px;background:linear-gradient(135deg,#43202a,#2a1519);box-shadow:0 2px 10px rgba(255,107,107,.12);white-space:nowrap;transition:transform .15s,background .2s,box-shadow .2s}.out:hover{box-shadow:0 2px 14px rgba(255,107,107,.3)}.out:active{transform:scale(.95);background:#5a2a30}

select,input[type=search]{flex:1;min-width:0}button.p{background:var(--ac);color:#04282b;font-weight:700;border:0}
#st{font-size:12px;color:var(--mut);margin-top:6px}#bar{height:6px;background:#1e4650;border-radius:4px;margin-top:6px;overflow:hidden}#bar i{display:block;height:100%;background:var(--ac);width:0}

main{padding:10px 12px 160px}.c{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border-left:4px solid #1e4650}

.cm{margin-top:6px;font-size:13px}.nbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk{background:none;border:1px solid #1e4650;color:var(--ac);padding:6px 2px;font-size:12px}.lk.or{border-color:var(--or);color:var(--or)}

.k small{color:var(--mut);font-size:11px;display:block;text-transform:uppercase}.k b{font-size:18px}.k .w{grid-column:1/-1}
h2{color:var(--or);font-size:18px;margin:4px 0 10px}.sc{overflow-x:auto;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #1e4650;padding:6px;white-space:nowrap;text-align:center}th{background:#0e2a31}td:first-child,th:first-child{position:sticky;left:0;background:#0e2a31;text-align:left}
td input{width:92px;padding:6px;text-align:right}td input.pd{outline:2px solid var(--or)}
.ring{display:block;margin:6px auto 14px}.hide{display:none!important}#login{text-align:center;padding:60px 20px}#login img{width:170px;border-radius:40px;box-shadow:0 0 40px rgba(58,254,235,.35)}#login h1{margin:16px 0;font-size:22px}
.sv th,.sv td{white-space:normal;min-width:104px;font-size:12px;font-weight:600}.sv td:first-child,.sv th:first-child{min-width:128px}.sv .h th,.sv .h td{background:#0f4d3c;color:#e8fbff}.sv .a td{background:#33261a}.sv .v td{background:#143a4c}.sv .s td{background:#143f2f}.sv .e td{background:#0e1a24}
.tt{font-weight:700;background:#0e2a31}

/* ---- Bilan : colonne des libellés + colonne Total ---- */
.bt{border-collapse:separate;border-spacing:0}.bt th,.bt td{border:0;border-bottom:1px solid #1e4650;border-right:1px solid #173a43}
.bt th{background:#0e2a31;color:var(--mut);font-weight:600;font-size:12px}
.bt th:first-child{background:linear-gradient(135deg,#0f6b5a,#13997a);color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.5px;border-right:2px solid var(--ac)}
.bt td.lb{position:sticky;left:0;z-index:2;color:#eafff6;font-weight:700;font-size:12px;white-space:normal;min-width:116px;background:linear-gradient(90deg,#0d5a49,#12745c);border-right:2px solid var(--ac);box-shadow:inset 4px 0 0 var(--lc,#3AFEEB)}
.bt tr.r1{--lc:#5aa9ff}.bt tr.r2{--lc:#ffa94d}.bt tr.r3{--lc:#4be38a}
.bt tr.r1 td:not(.lb):not(.tt){background:#0f2f3d}.bt tr.r2 td:not(.lb):not(.tt){background:#2b2319}.bt tr.r3 td:not(.lb):not(.tt){background:#102e26}
.bt th:last-child,.bt td.tt{position:sticky;right:0;z-index:2;border-left:2px solid #f2c14e}
.bt th:last-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.bt td.tt{background:linear-gradient(135deg,#3b2b08,#5e4512);color:#ffd77a;font-weight:800;font-size:13px;min-width:92px}
.bt td input{background:rgba(4,24,30,.55)}
.k .tv{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#3AFEEB,#ffd77a 50%,#4be38a) border-box;box-shadow:0 0 18px rgba(58,254,235,.28),0 0 28px rgba(255,215,122,.15);animation:glow 3.2s ease-in-out infinite}
.k .tv small{color:#ffd77a}.k .tv b{color:#fff}
@keyframes glow{50%{box-shadow:0 0 26px rgba(58,254,235,.5),0 0 38px rgba(255,215,122,.3)}}

.sv tr>:last-child{position:sticky;right:0;z-index:2;border-left:2px solid #f2c14e;font-weight:800;background:linear-gradient(135deg,#3b2b08,#5e4512);color:#ffd77a}
.sv tr.h>:last-child{background:linear-gradient(135deg,#a8780e,#f2c14e);color:#2b1c00;text-transform:uppercase;letter-spacing:.5px}
.sv tr:not(.h)>:first-child{box-shadow:inset 3px 0 0 var(--lc,#3AFEEB)}.sv tr.a{--lc:#ffa94d}.sv tr.v{--lc:#5aa9ff}.sv tr.s{--lc:#4be38a}
.fn{color:var(--mut);font-size:12px;margin:8px 2px}
/* ---- Animation d'envoi ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none;background:rgba(3,18,22,0);transition:background .45s}#fx.on{background:rgba(3,18,22,.4)}
#toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:51;padding:14px 22px;border-radius:18px;background:rgba(10,40,46,.92);border:1px solid var(--ac);color:#fff;font-weight:800;font-size:17px;text-align:center;box-shadow:0 0 30px rgba(58,254,235,.45);opacity:0;pointer-events:none;max-width:84vw}
#toast.go{animation:pop 2.2s ease forwards}@keyframes pop{12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
</style></head><body>
<div id="login"><img src="icon-512.png" alt=""><h1>Gestion Pharmacie - EPHD Sandégué 2027</h1><p>Connectez-vous avec votre compte Microsoft pour accéder au classeur.</p><button class="p" onclick="signIn()">Se connecter</button><p id="err" style="color:var(--ko)"></p></div>
<div id="app" class="hide">
<header><div class="top"><img class="lg" src="icon-192.png" alt=""><h1>Gestion Pharmacie - EPHD Sandégué 2027</h1><button id="rf" class="rf" onclick="load()" aria-label="Actualiser"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
<div class="row"><select id="mois" onchange="load()"></select><select id="mode" onchange="render()"><option value="pos">Ordre magasin</option><option value="todo">À inventorier</option><option value="vente">Plus vendus</option></select></div>
<div id="sf"><div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Rechercher un produit…" oninput="render()"></div></div>
<div class="srow"><div id="st"></div><button class="out" onclick="signOut()">Se déconnecter</button></div><div id="bar"><i></i></div><div id="fin" class="hide">✔ INVENTAIRE TERMINÉ</div></header>
<main id="main"></main>
<div id="act"><button id="b-stock" class="p" onclick="valider()">Je valide l'inventaire.</button><button id="b-bilan" class="p hide" onclick="validerB()">Je valide les recettes</button></div>
<nav><button id="t-stock" class="on" onclick="tab('stock')">📦 Stock</button><button id="t-bilan" onclick="tab('bilan')">💰 Bilan</button><button id="t-rec" onclick="tab('rec')">📈 Recouvrement</button></nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
/* ====== CONFIGURATION ====== */
const CLIENT_ID = "2fd34dea-3839-4d3c-ad3b-6e08817b507a";
const FILE_PATH = "/Gestion Pharma FP/O_PHARMA_2027.xlsm";
/* =========================== */
const MOIS=["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN","JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];
const EDIT=["STOCK ENTRÉ","STOCK INVENTORIÉ","PERTES"],ELAB=["Entré","Inventorié","Pertes"];
const pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
const SCOPES=["Files.ReadWrite","User.Read"];
const $=id=>document.getElementById(id),enc=encodeURIComponent,S="§",J=JSON.stringify;
const num=v=>typeof v==="number"?Math.round(v).toLocaleString("fr-FR"):(v||"0");const fcfa=v=>num(v)+" FCFA";
let CACHE=(()=>{try{return JSON.parse(localStorage.getItem("op_notes")||"{}")}catch(e){return{}}})(),NX={},NXT=false,token,H=[],R=[],origin={row:5,col:0},editing=false,cur="stock",NOTES={},NROWS=[],NT=false,BIL=null;
let P=Object.assign({v:{},c:{},b:{}},JSON.parse(localStorage.getItem("op_pend")||"{}"));
const keep=()=>localStorage.setItem("op_pend",J(P));
MOIS.forEach(m=>$("mois").add(new Option(m,m)));$("mois").value=MOIS[new Date().getMonth()];
async function signIn(){try{await pca.loginRedirect({scopes:SCOPES})}catch(e){$("err").textContent=e.message}}
async function tok(){const a=pca.getAllAccounts()[0];if(!a)throw 0;try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){await pca.acquireTokenRedirect({scopes:SCOPES})}}
async function g(path,opt={}){const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:${encodeURI(FILE_PATH)}:/workbook${path}`,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"}});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error?.message||r.status);return r.json()}
const col=n=>{let s="";n++;while(n){s=String.fromCharCode(65+(n-1)%26)+s;n=Math.floor((n-1)/26)}return s};
const parse=a=>{const m=a.split("!")[1].replace(/\$/g,"").match(/([A-Z]+)(\d+):/);return{row:+m[2],col:[...m[1]].reduce((x,c)=>x*26+c.charCodeAt(0)-64,0)-1}};
const put=(addr,sheet,v)=>g(`/worksheets('${enc(sheet)}')/range(address='${addr}')`,{method:"PATCH",body:J({values:[[v]]})});
function tab(t){cur=t;for(const k of["stock","bilan","rec"])$("t-"+k).classList.toggle("on",k==t);
 const s=t=="stock";$("act").classList.toggle("hide",t=="rec");$("b-stock").classList.toggle("hide",!s);$("b-bilan").classList.toggle("hide",t!="bilan");
 for(const i of["sf","mode","bar"])$(i).classList.toggle("hide",!s);$("mois").classList.toggle("hide",t=="rec");$("fin").classList.add("hide");load()}
const saveCache=()=>localStorage.setItem("op_notes",J(CACHE));
/* Notes : base = feuille NOTES_EXCEL (exportée par la macro à chaque enregistrement du classeur) ;
   par-dessus : notes envoyées par l'appli et pas encore converties/exportées par Excel (NOTES_APP + cache local). */
async function loadNotes(){NX={};NXT=false;NOTES={};NROWS=[];NT=false;const pend={};
 try{const x=await g("/tables('NOTES_EXCEL')/range");x.values.slice(1).forEach(r=>{if(r[0]&&r[1]&&r[2]&&String(r[3]).trim()!=="")NX[r[0]+S+r[1]+S+r[2]]=String(r[3])});NXT=true}catch(e){}
 try{const d=await g("/tables('NOTES_APP')/rows");NROWS=d.value.map(x=>x.values[0]);NT=true;NROWS.forEach(r=>{if(!NXT||r[5]==="A_APPLIQUER")pend[r[0]+S+r[1]+S+r[2]]=String(r[3]||"")})}catch(e){NROWS=[];NT=false}
 NOTES=Object.assign({},NX);for(const k in pend){if(pend[k])NOTES[k]=pend[k];else delete NOTES[k]}
 let ch=false;for(const k in CACHE){if(k in pend)continue;const c=CACHE[k],t=typeof c==="string"?c:c.t;
  if(!NXT){if(t)NOTES[k]=t;continue}
  if(typeof c==="object"&&(NX[k]||"")===c.b){if(t)NOTES[k]=t;else delete NOTES[k]}else{delete CACHE[k];ch=true}}
 if(ch)saveCache()}
async function load(){if(editing)return;$("rf").classList.add("spin");try{token=await tok();const m=$("mois").value;
 if(cur=="stock"){const d=await g(`/tables('STOCK_${enc(m)}')/range`);H=d.values[0];R=d.values.slice(1);origin=parse(d.address);await loadNotes();render();$("st").dataset.t="Synchronisé à "+new Date().toLocaleTimeString("fr-FR")}
 else if(cur=="bilan")await bilan(m);else await recou();stat()}catch(e){$("st").textContent="⚠ "+e.message}$("rf").classList.remove("spin")}
const ix=n=>H.indexOf(n),NK=(p,n)=>$("mois").value+S+p+S+n,pr=r=>r[ix("PRODUITS (DCI)")];
const val=(r,n)=>{const k=NK(pr(r),n);return k in P.v?P.v[k]:r[ix(n)]};
const rows=()=>R.map((r,i)=>({r,i})).filter(x=>pr(x.r)&&String(pr(x.r)).trim().toUpperCase()!=="TOTAL");
function stat(){const np=Object.keys(P.v).length+Object.keys(P.c).length+Object.keys(P.b).length,tail=np?` · ${np} modif. à envoyer`:"";
 if(cur!="stock"){$("st").textContent=(np?`${np} modif. à envoyer`:"")+($("st").dataset.s||"");return}
 const all=rows(),f=all.filter(x=>val(x.r,"STOCK INVENTORIÉ")!=="").length;$("bar").firstChild.style.width=(all.length?100*f/all.length:0)+"%";
 $("st").textContent=`${f}/${all.length} inventoriés`+(all.length&&f==all.length?"":` — reste ${all.length-f}`)+tail+" · "+($("st").dataset.t||"");$("fin").classList.toggle("hide",!(all.length&&f==all.length))}
function render(){if(cur!="stock")return;const iN=ix("N° Pos."),iV=ix("VALEUR VENTE S. SORTI"),iU=ix("UNITE DE COMPTAGE"),iS=ix("STOCK INITIAL");
 const q=$("q").value.toLowerCase(),mode=$("mode").value;let L=rows().filter(x=>String(pr(x.r)).toLowerCase().includes(q));
 if(mode=="todo")L=L.filter(x=>val(x.r,"STOCK INVENTORIÉ")==="");
 L.sort((a,b)=>mode=="vente"?(+b.r[iV]||0)-(+a.r[iV]||0):(+a.r[iN]||999)-(+b.r[iN]||999));
 $("main").innerHTML=L.map(({r,i})=>{const p=pr(r),pend=EDIT.some(n=>NK(p,n) in P.v||NK(p,n) in P.c);
 const nv=n=>{const k=NK(p,n);return k in P.c?P.c[k]:(NOTES[k]||"")};
 return `<div class="c ${val(r,"STOCK INVENTORIÉ")===""?"todo":"done"} ${pend?"pend":""}"><div class="t"><span>${p}</span><span class="n">#${r[iN]}</span></div>
 <div class="m">${r[iU]} · Stock initial : ${r[iS]}</div><div class="f">${EDIT.map(n=>`<div><label>${ELAB[EDIT.indexOf(n)]}</label><input type="number" inputmode="decimal" value="${val(r,n)}" onfocus="editing=true" onblur="editing=false;stat()" oninput="setV(${i},'${n}',this.value)"></div>`).join("")}</div>
 <div class="cm"><div class="nbs" style="margin-top:8px">${EDIT.map((n,j)=>`<button class="lk ${NK(p,n) in P.c?"or":""}" onclick="tn(this,${j})">💬 ${ELAB[j]}${nv(n)?" •":""}</button>`).join("")}</div>
 ${EDIT.map((n,j)=>`<div class="nb hide"><small>Note — ${ELAB[j]}${NK(p,n) in P.c?" (à envoyer)":""}</small><textarea rows="2" placeholder="Note de la cellule…" onfocus="editing=true" onblur="editing=false;stat()" oninput="setC(${i},'${n}',this.value)">${nv(n).replace(/</g,"&lt;")}</textarea></div>`).join("")}</div></div>`}).join("")}
function tn(b,j){b.closest(".cm").querySelectorAll(".nb").forEach((e,x)=>x==j?e.classList.toggle("hide"):e.classList.add("hide"))}
function setV(i,n,v){P.v[NK(pr(R[i]),n)]=v===""?"":Number(v);keep();stat()}
function setC(i,n,v){const k=NK(pr(R[i]),n);v===(NOTES[k]||"")?delete P.c[k]:P.c[k]=v;keep();stat()}
async function ensureNotes(){if(NT)return;await g("/worksheets/add",{method:"POST",body:J({name:"NOTES_APP"})}).catch(()=>{});
 await g("/worksheets('NOTES_APP')/range(address='A1:F1')",{method:"PATCH",body:J({values:[["MOIS","PRODUIT","CHAMP","NOTE","ORIGINE","STATUT"]]})});
 const t=await g("/tables/add",{method:"POST",body:J({address:"NOTES_APP!A1:F1",hasHeaders:true})});
 await g(`/tables('${enc(t.id)}')`,{method:"PATCH",body:J({name:"NOTES_APP"})});NT=true}
async function putNote(m,p,c,txt){await ensureNotes();const i=NROWS.findIndex(r=>r[0]==m&&r[1]==p&&r[2]==c),row=[m,p,c,txt,"APP","A_APPLIQUER"];
 if(i>=0){await g(`/tables('NOTES_APP')/rows/itemAt(index=${i})`,{method:"PATCH",body:J({values:[row]})});NROWS[i]=row}
 else{await g("/tables('NOTES_APP')/rows/add",{method:"POST",body:J({values:[row]})});NROWS.push(row)}const kc=m+S+p+S+c;CACHE[kc]={t:txt,b:NX[kc]||""};saveCache()}
async function valider(){const m=$("mois").value,b=$("b-stock"),ks=Object.keys(P.v).filter(k=>k.startsWith(m+S)),cs=Object.keys(P.c).filter(k=>k.startsWith(m+S)),tot=ks.length+cs.length;let n=0;
 editing=false;if(!tot)return load();b.disabled=true;const fx=FX.start("pills");
 try{token=await tok();
 for(const k of ks){const[,p,c]=k.split(S),i=R.findIndex(r=>pr(r)===p);if(i<0)continue;await put(col(origin.col+ix(c))+(origin.row+1+i),m,P.v[k]);delete P.v[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}
 if(cs.length){await loadNotes();for(const k of cs){const[,p,c]=k.split(S);await putNote(m,p,c,P.c[k]);delete P.c[k];keep();$("st").textContent=`Envoi ${++n}/${tot}…`}}
 fx.finish("Inventaire envoyé vers Excel");await load();$("st").dataset.t="✔ Envoyé à "+new Date().toLocaleTimeString("fr-FR");stat()}
 catch(e){fx.cancel();$("st").textContent="⚠ Envoi interrompu : "+e.message+" (le reste est conservé)"}b.disabled=false}
async function bilan(m){const d=await g(`/worksheets('${enc(m)}')/range(address='A74:R115')`),V=d.values,r=V.findIndex(x=>x[1]==="DATE DE VERSEMENTS");
 if(r<0){$("main").innerHTML="<p>Bilan financier introuvable.</p>";return}
 BIL={V,r,m};const f=l=>V.find(x=>x[1]===l)?.[2],R0=74+r,ec=String(f("ECART")??"–");
 const inp=row=>V[row-74].slice(2,13).map((x,j)=>`<td><input type="number" inputmode="decimal" value="${bv(row,j+2)}" class="${m+S+row+S+col(j+2) in P.b?"pd":""}" onfocus="editing=true" onblur="editing=false;stat()" oninput="setB(${row},${j+2},this.value)"></td>`).join("");
 $("main").innerHTML=`<h2>${V[r-1][2]||"Bilan financier - "+m}</h2><div class="k"><div class="w"><small>Total recette</small><b>${fcfa(f("Total Recette"))}</b></div>
 <div><small>Écart</small><b style="color:${ec[0]=="▲"?"var(--ok)":ec[0]=="▼"?"var(--ko)":"inherit"}">${ec}</b></div><div class="tv"><small>Montant total versé</small><b>${fcfa(f("MONTANT TOTAL VERSÉ"))}</b></div></div>
 <div class="sc"><table class="bt"><tr><th>${V[r][1]}</th>${V[r].slice(2,13).map(x=>`<th>${x}</th>`).join("")}<th>Total</th></tr>
 <tr class="r1"><td class="lb">${V[r+1][1]}</td>${inp(R0+1)}<td class="tt" id="tt1">${num(V[r+1][13])}</td></tr><tr class="r2"><td class="lb">${V[r+2][1]}</td>${inp(R0+2)}<td class="tt" id="tt2">${num(V[r+2][13])}</td></tr>
 <tr class="r3"><td class="lb">${V[r+3][1]}</td>${V[r+3].slice(2,13).map((x,j)=>`<td id="rc${j+2}">${num(x)}</td>`).join("")}<td class="tt" id="tt3">${num(V[r+3][13])}</td></tr></table></div>
 <p style="color:var(--mut);font-size:12px">Saisissez les montants versés et les dépenses, puis appuyez sur « Je valide les recettes ».</p>`}
const bv=(row,j)=>{const k=BIL.m+S+row+S+col(j);return k in P.b?P.b[k]:BIL.V[row-74][j]};
function recalc(){if(!BIL)return;const R0=74+BIL.r,t=[0,0];for(let j=2;j<13;j++){const a=+bv(R0+1,j)||0,b=+bv(R0+2,j)||0;t[0]+=a;t[1]+=b;const e=$("rc"+j);if(e)e.textContent=num(a+b)}
 [t[0],t[1],t[0]+t[1]].forEach((v,i)=>{const e=$("tt"+(i+1));if(e)e.textContent=num(v)})}
function setB(row,j,v){P.b[$("mois").value+S+row+S+col(j)]=v===""?"":Number(v);keep();recalc();stat()}
async function validerB(){const m=$("mois").value,b=$("b-bilan"),ks=Object.keys(P.b).filter(k=>k.startsWith(m+S));let n=0;editing=false;if(!ks.length)return load();b.disabled=true;const fx=FX.start("money");
 try{token=await tok();for(const k of ks){const[,row,c]=k.split(S);await put(c+row,m,P.b[k]);delete P.b[k];keep();$("st").textContent=`Envoi ${++n}/${ks.length}…`}
 fx.finish("Recettes envoyées vers Excel");await load();$("st").dataset.s=" · ✔ Versements envoyés";stat()}catch(e){fx.cancel();$("st").textContent="⚠ Envoi interrompu : "+e.message}b.disabled=false}
const pool=async(fns,n)=>{const out=[];let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<fns.length){const k=i++;out[k]=await fns[k]().catch(()=>null)}}));return out};
/* Les lignes ACHAT / SOLDE / Factures échues de SOLVABILITÉ utilisent INDIRECT(« LIVRAISONS_RECOU_… [[#Totaux];[DÉBIT]] ») : syntaxe dépendante de la langue d'Excel,
   qui renvoie #REF! quand le classeur est calculé via Microsoft Graph (anglais). On relit donc les totaux DÉBIT des 12 tableaux et on refait EXACTEMENT les mêmes calculs que le classeur. */
async function recou(){const sh=enc("SOLVABILITÉ"),d=await g(`/worksheets('${sh}')/range(address='C2:R9')`),T=d.text,V=d.values,
 n=x=>typeof x==="number"?x:(parseFloat(x)||0),fm=v=>Math.round(v).toLocaleString("fr-FR")+" F CFA",
 A=await pool(MOIS.map(m=>()=>g(`/tables('LIVRAISONS_RECOU_${enc(m)}')/columns('${enc("DÉBIT")}')/totalRowRange`).then(x=>n(x.values[0][0]))),4);
 let pc=typeof V[7][14]==="number"?V[7][14]:0;
 if(A.every(x=>x!==null)){const rep=n(V[2][1]);let s=rep,fac=0,R5=0;
  for(let j=0;j<12;j++){const c=2+j,vs=n(V[3][c]);fac+=A[j];s=s+A[j]-vs;R5+=vs;T[2][c]=fm(A[j]);T[4][c]=fm(s);T[5][c]=fm(fac)}
  const vq=n(V[3][14]);R5+=vq;s-=vq;const R4=rep+A.reduce((x,y)=>x+y,0);
  T[4][14]=fm(s);T[2][15]=fm(R4);T[3][15]=fm(R5);T[4][15]=fm(R4-R5);T[5][15]=fm(fac);pc=R4?R5/R4:0}
 pc=Math.max(0,Math.min(pc,1));const C=2*Math.PI*70,mm=MOIS[new Date().getMonth()],cl=["h","a","v","s","e"],an=-Math.PI/2+pc*2*Math.PI,dx=90+70*Math.cos(an),dy=90+70*Math.sin(an);
 $("main").innerHTML=`<h2>SUIVI DU RECOUVREMENT – NPSP</h2><svg class="ring" width="250" height="250" viewBox="0 0 180 180"><circle cx="90" cy="90" r="70" fill="none" stroke="#1d4a52" stroke-width="16"/>
 <circle cx="90" cy="90" r="70" fill="none" stroke="#3AFEEB" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}" transform="rotate(-90 90 90)"/><circle cx="${dx.toFixed(2)}" cy="${dy.toFixed(2)}" r="10" fill="#3AFEEB"/>
 <text x="90" y="96" text-anchor="middle" fill="#fff" font-size="40" font-weight="800">${Math.round(pc*100)}%</text><text x="90" y="113" text-anchor="middle" fill="#4be38a" font-size="8.5">TAUX DE RECOUVREMENT NPSP</text><text x="90" y="124" text-anchor="middle" fill="#4be38a" font-size="8.5">EN ${mm}</text></svg>
 <h2 style="font-size:15px">${T[0][0]}</h2><div class="sc"><table class="sv">${T.slice(1,6).map((r,i)=>`<tr class="${cl[i]}">${r.map((c,j)=>i==0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div><p class="fn">${T[6][0]||""}</p>`}
/* ====== ANIMATION D'ENVOI VERS EXCEL : pluie de gélules (inventaire) / de billets et de pièces (recettes) ====== */
const FX=(()=>{let cv,cx,P=[],W=0,H=0,raf=0,em=false,kind="",last=0,T=0,acc=0,minEnd=0,id=0;
 const red=matchMedia("(prefers-reduced-motion: reduce)").matches,MAX=red?50:170,RATE=red?35:115,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
 const CAPS=[["#ff4d6d","#ffe3e8"],["#13c8b5","#ffffff"],["#ffb703","#fff3cf"],["#3fd47f","#eafff2"],["#6f7dff","#ffffff"],["#ff8fab","#fff0f4"],["#ff7a2f","#fff1e6"]];
 const NOTE=[["1000","#2f6fd6","#a9c8ff"],["2000","#d2494a","#ffb9b6"],["5000","#2a9a58","#a6f0c3"],["10000","#d69424","#ffe3a6"]];
 function init(){if(cv)return;cv=document.createElement("canvas");cv.id="fx";document.body.appendChild(cv);cx=cv.getContext("2d");addEventListener("resize",size);size()}
 function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
 const rr=(x,y,w,h,r)=>{cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()};
 function make(burst){const s={x:rnd(-10,W+10),y:burst?rnd(-H*.6,-20):rnd(-70,-20),vx:rnd(-30,30),vy:rnd(130,330),a:rnd(0,6.28),va:rnd(-4,4),fl:rnd(0,6.28),vf:rnd(2,6),sw:rnd(0,6.28),sf:rnd(1.5,3.5),sa:rnd(12,45),k:rnd(.85,1.4)};
  if(kind=="pills"){const r=Math.random();s.t=r<.5?"cap":r<.8?"tab":"gel";s.c=pick(CAPS)}
  else{if(Math.random()<.5){s.t="note";s.c=pick(NOTE)}else{s.t="coin";s.c=Math.random()<.65?["#f7d154","#b8860b","#fff3b0"]:["#e6edf3","#8a9aa8","#ffffff"]}}
  P.push(s)}
 function draw(s){const f=Math.abs(Math.cos(s.fl));cx.save();cx.translate(s.x,s.y);
  if(s.t=="cap"){const w=27*s.k,h=11.5*s.k;cx.rotate(s.a);cx.scale(1,Math.max(.3,f));rr(-w/2,-h/2,w,h,h/2);cx.save();cx.clip();cx.fillStyle=s.c[0];cx.fillRect(-w/2,-h/2,w/2,h);cx.fillStyle=s.c[1];cx.fillRect(0,-h/2,w/2,h);cx.fillStyle="rgba(255,255,255,.5)";cx.fillRect(-w/2+3,-h/2+1.6,w-6,2.2);cx.fillStyle="rgba(0,0,0,.12)";cx.fillRect(-w/2,h/2-2.6,w,2.6);cx.restore();rr(-w/2,-h/2,w,h,h/2);cx.strokeStyle="rgba(0,0,0,.28)";cx.lineWidth=1;cx.stroke()}
  else if(s.t=="tab"){const r=7*s.k;cx.rotate(s.a);cx.scale(1,Math.max(.35,f));cx.beginPath();cx.arc(0,0,r,0,6.283);cx.fillStyle="#f4fbff";cx.fill();cx.strokeStyle="rgba(0,0,0,.25)";cx.lineWidth=1;cx.stroke();cx.beginPath();cx.moveTo(-r*.8,0);cx.lineTo(r*.8,0);cx.strokeStyle=s.c[0];cx.lineWidth=1.6;cx.stroke()}
  else if(s.t=="gel"){const w=19*s.k,h=11*s.k;cx.rotate(s.a);cx.scale(1,Math.max(.4,f));cx.beginPath();cx.ellipse(0,0,w/2,h/2,0,0,6.283);cx.fillStyle="#ffbf3c";cx.fill();cx.strokeStyle="rgba(120,60,0,.45)";cx.lineWidth=1;cx.stroke();cx.beginPath();cx.ellipse(-w*.12,-h*.15,w*.28,h*.16,0,0,6.283);cx.fillStyle="rgba(255,255,255,.65)";cx.fill()}
  else if(s.t=="note"){const w=50*s.k,h=25*s.k;cx.rotate(Math.sin(s.a*.5)*.8);cx.scale(Math.max(.22,Math.abs(Math.cos(s.fl*.55))),1);rr(-w/2,-h/2,w,h,3);cx.fillStyle=s.c[2];cx.fill();rr(-w/2+3,-h/2+3,w-6,h-6,2);cx.fillStyle=s.c[1];cx.fill();cx.beginPath();cx.arc(0,0,h*.28,0,6.283);cx.fillStyle="rgba(255,255,255,.28)";cx.fill();cx.strokeStyle=s.c[2];cx.lineWidth=1;cx.stroke();cx.fillStyle="#fff";cx.font="bold "+Math.round(8*s.k)+"px system-ui,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(s.c[0],0,.5);cx.font="bold 6px system-ui,sans-serif";cx.fillText("F",-w/2+7,-h/2+7);cx.fillText("F",w/2-7,h/2-7)}
  else{const r=11*s.k;cx.scale(Math.max(.14,f),1);cx.beginPath();cx.arc(0,0,r,0,6.283);cx.fillStyle=s.c[0];cx.fill();cx.lineWidth=2;cx.strokeStyle=s.c[1];cx.stroke();cx.beginPath();cx.arc(0,0,r*.68,0,6.283);cx.strokeStyle=s.c[2];cx.lineWidth=1;cx.stroke();cx.fillStyle=s.c[1];cx.font="bold "+Math.round(r*.95)+"px system-ui,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("F",0,1)}
  cx.restore()}
 function frame(ts){raf=requestAnimationFrame(frame);const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;T+=dt;
  if(em){acc+=dt*RATE;while(acc>=1){acc--;if(P.length<MAX)make(false)}}
  cx.clearRect(0,0,W,H);
  for(let i=P.length-1;i>=0;i--){const s=P[i];s.vy=Math.min(s.vy+720*dt,860);s.x+=s.vx*dt+Math.cos(s.sw+T*s.sf)*s.sa*dt;s.y+=s.vy*dt;s.a+=s.va*dt;s.fl+=s.vf*dt;if(s.y>H+80){P.splice(i,1);continue}draw(s)}
  if(!em&&!P.length){cancelAnimationFrame(raf);raf=0;cv.style.display="none"}}
 function toast(m){let e=$("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=m;e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
 function start(k){init();const me=++id;kind=k;em=true;acc=0;P=[];for(let i=0;i<(red?10:42);i++)make(true);cv.style.display="block";requestAnimationFrame(()=>cv.classList.add("on"));minEnd=performance.now()+2400;
  if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  return{finish(msg){setTimeout(()=>{if(id==me){em=false;cv.classList.remove("on")}if(msg)toast(msg)},Math.max(0,minEnd-performance.now()))},cancel(){if(id==me){em=false;cv.classList.remove("on")}}}}
 return{start}})();
async function signOut(){if(Object.keys(P.v).length+Object.keys(P.c).length+Object.keys(P.b).length&&!confirm("Des modifications n'ont pas été envoyées. Se déconnecter quand même ?"))return;
 try{await pca.logoutRedirect({account:pca.getAllAccounts()[0],postLogoutRedirectUri:location.origin+location.pathname})}catch(e){$("st").textContent="⚠ "+e.message}}
(async()=>{await pca.handleRedirectPromise();if(pca.getAllAccounts().length){$("login").classList.add("hide");$("app").classList.remove("hide");load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()})}})();
</script></body></html>
